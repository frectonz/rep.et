  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    #map { height: 100vh; width: 100vw; }

      font: 13px/1.5 sans-serif;
      min-width: 180px;
      padding: 10px 12px;
    }
    .popup-location { font-weight: bold; }
    .popup-region { color: #666; }
    .popup-hr { margin: 4px 0; border: none; border-top: 1px solid #ddd; }
    .popup-candidate { font-weight: bold; }
    .popup-party-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 4px;
    }
    .legend {
      position: absolute; bottom: 30px; right: 10px;
      background: white; padding: 10px 14px;
      border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      font: 13px/1.6 sans-serif; z-index: 1;
    }
    .legend h4 { margin: 0 0 6px; font-size: 14px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-color {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid #555; flex-shrink: 0;
    }
  </style>
</head>

    const PARTY_COLORS = {
      'Prosperity Party': '#1a9641',
      'Ethiopian Citizens for Social Justice (EZEMA)': '#7b3294',
      'National Movement of Amhara': '#2b83ba',
      'Gedio People Democratic Organization': '#fdae61',
      'Kucha People Democratic Party': '#abd9e9',
      'Independent': '#9e9e9e'
    };

    var map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [39.5, 9.0],
      zoom: 5.5
    });

    map.on('load', function() {
      map.addSource('constituencies', {
        type: 'geojson',
        data: DATA
      });

      // Build match expression for party colors
      var colorMatch = ['match', ['get', 'party']];
      Object.keys(PARTY_COLORS).forEach(function(party) {
        colorMatch.push(party, PARTY_COLORS[party]);
      });
      colorMatch.push('#9e9e9e'); // fallback

      map.addLayer({
        id: 'constituency-dots',
        type: 'circle',
        source: 'constituencies',
        paint: {
          'circle-radius': 6,
          'circle-color': colorMatch,
          'circle-stroke-color': '#fff',
          'circle-stroke-width': 1.5,
          'circle-opacity': 0.85
        }
      });

      // Popup on click
      map.on('click', 'constituency-dots', function(e) {
        var f = e.features[0];
        var p = f.properties;
        var color = PARTY_COLORS[p.party] || '#9e9e9e';
        var votes = p.votes != null ? Number(p.votes).toLocaleString() : 'N/A';
        new maplibregl.Popup()
          .setLngLat(f.geometry.coordinates)
          .setHTML(
            '<div class="popup-location">' + p.location + '</div>' +
            '<div class="popup-region">' + p.region + '</div>' +
            '<hr class="popup-hr">' +
            '<div class="popup-candidate">' + p.candidate + '</div>' +
            '<div><span class="popup-party-dot" style="background:' + color + '"></span>' + p.party + '</div>' +
            '<div>Votes: <strong>' + votes + '</strong></div>'
          )
          .addTo(map);
      });

      map.on('mouseenter', 'constituency-dots', function() {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'constituency-dots', function() {
        map.getCanvas().style.cursor = '';
      });
    });

    // Legend
    var legendEl = document.getElementById('legend');
    legendEl.innerHTML = '<h4>Parties</h4>';
    Object.keys(PARTY_COLORS).forEach(function(party) {
      legendEl.innerHTML +=
        '<div class="legend-item">' +
        '<span class="legend-color" style="background:' + PARTY_COLORS[party] + '"></span>' +
        party + '</div>';
    });
  </script>
